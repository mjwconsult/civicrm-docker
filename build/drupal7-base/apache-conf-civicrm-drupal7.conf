# Apache configuration specific to CiviCRM on Drupal 7, with the Drupal tree
# (and the docroot) in /var/www/html.

# Uploaded files are writable by the web server, so they may be served but never
# run as PHP. Drupal's own .htaccess there says the same; this holds even if it
# goes missing. php_admin_* cannot be lifted by .htaccess.
<Directory "/var/www/html/sites/*/files">
    php_admin_flag engine off
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# CiviCRM keeps its logs, uploads, custom field files and compiled templates
# under the public files directory on Drupal. CiviCRM serves what it needs from
# these itself, so never serve them directly. persist/ (images for contribution
# pages and mailings) and ext/ stay served.
<DirectoryMatch "^/var/www/html/sites/[^/]+/files/civicrm/(ConfigAndLog|upload|custom|templates_c)">
    Require all denied
</DirectoryMatch>
